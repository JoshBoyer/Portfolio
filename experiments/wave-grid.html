<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wave Grid — Experiments</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌊</text></svg>" />
  <link rel="stylesheet" href="../styles.css" />
  <style>
    .controls {
      position: absolute;
      top: 16px;
      right: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 14px 16px;
      background: rgba(18, 21, 29, 0.85);
      border: 1px solid var(--border);
      border-radius: 12px;
      backdrop-filter: blur(8px);
      font-size: 0.85rem;
    }
    .controls label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--text-dim);
      font-family: var(--mono);
    }
    .controls input[type="range"] { width: 130px; accent-color: var(--accent); }
  </style>
</head>
<body>
  <div class="exp-topbar">
    <a href="../index.html#experiments">← back</a>
    <h1>🌊 Wave Grid</h1>
    <span class="hint">adjust the sliders</span>
  </div>
  <div class="exp-stage">
    <canvas id="stage"></canvas>
    <div class="controls">
      <label>frequency <input id="freq" type="range" min="0.2" max="3" step="0.05" value="1" /></label>
      <label>amplitude <input id="amp" type="range" min="2" max="40" step="1" value="14" /></label>
      <label>speed <input id="speed" type="range" min="0.2" max="4" step="0.1" value="1.4" /></label>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("stage");
    const ctx = canvas.getContext("2d");
    const params = { freq: 1, amp: 14, speed: 1.4 };
    const SPACING = 26;

    for (const key of ["freq", "amp", "speed"]) {
      const input = document.getElementById(key);
      input.addEventListener("input", () => { params[key] = parseFloat(input.value); });
    }

    function resize() {
      canvas.width = canvas.clientWidth * devicePixelRatio;
      canvas.height = canvas.clientHeight * devicePixelRatio;
      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    }

    function step(now) {
      const w = canvas.clientWidth, h = canvas.clientHeight;
      const t = (now / 1000) * params.speed;
      ctx.clearRect(0, 0, w, h);

      for (let x = SPACING / 2; x < w; x += SPACING) {
        for (let y = SPACING / 2; y < h; y += SPACING) {
          const phase = (x + y) * 0.012 * params.freq;
          const offset = Math.sin(phase + t) * params.amp;
          const wobble = Math.cos(phase * 1.7 + t * 0.8) * params.amp * 0.4;
          const size = 1.2 + (Math.sin(phase + t) + 1) * 1.4;
          const hueMix = (Math.sin(phase + t) + 1) / 2;
          // blend between the site's teal and indigo accents
          const r = Math.round(94 + (129 - 94) * hueMix);
          const g = Math.round(234 + (140 - 234) * hueMix);
          const b = Math.round(212 + (248 - 212) * hueMix);
          ctx.fillStyle = `rgba(${r}, ${g}, ${b}, 0.85)`;
          ctx.beginPath();
          ctx.arc(x + wobble, y + offset, size, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      requestAnimationFrame(step);
    }

    window.addEventListener("resize", resize);
    resize();
    requestAnimationFrame(step);
  </script>
</body>
</html>
